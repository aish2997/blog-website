name: Deploy to Cloud Run

on:
  push:
    branches:
      - main
      - production
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: ${{ secrets.GCP_REGION || 'us-central1' }}
  ENVIRONMENT: ${{ github.event.inputs.environment || 'production' }}

jobs:
  build-image:
    name: Build Docker Image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.image_info.outputs.image_tag }}
      image_sha: ${{ steps.image_info.outputs.image_sha }}

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug Environment
        run: |
          echo "PROJECT_ID: ${{ env.PROJECT_ID }}"
          echo "REGION: ${{ env.REGION }}"
          echo "ENVIRONMENT: ${{ env.ENVIRONMENT }}"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build Docker Image
        run: |
          IMAGE_TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/portfolio-images/portfolio"

          # Build with Dockerfile in docker/ directory, context is root
          docker build \
            -f docker/Dockerfile \
            -t ${IMAGE_TAG}:latest \
            -t ${IMAGE_TAG}:${{ github.sha }} \
            .

      - name: Push Docker Image
        run: |
          IMAGE_TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/portfolio-images/portfolio"
          docker push ${IMAGE_TAG}:latest
          docker push ${IMAGE_TAG}:${{ github.sha }}

      - name: Set Image Info
        id: image_info
        run: |
          IMAGE_BASE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/portfolio-images/portfolio"
          echo "Building image reference: ${IMAGE_BASE}"
          echo "Latest tag: ${IMAGE_BASE}:latest"
          echo "SHA tag: ${IMAGE_BASE}:${{ github.sha }}"
          echo "image_tag=${IMAGE_BASE}:latest" >> $GITHUB_OUTPUT
          echo "image_sha=${IMAGE_BASE}:${{ github.sha }}" >> $GITHUB_OUTPUT

  infrastructure:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    needs: build-image
    outputs:
      cloud_run_service: ${{ steps.terraform_output.outputs.service_name }}
      cloud_run_url: ${{ steps.terraform_output.outputs.cloud_run_url }}

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0
          terraform_wrapper: false

      - name: Initialize Terraform
        working-directory: ./terraform/infrastructure
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"

      - name: Plan Infrastructure
        working-directory: ./terraform/infrastructure
        run: |
          # Use the image that was just built
          DOCKER_IMAGE="${{ needs.build-image.outputs.image_tag }}"

          echo "Docker image from build-image job: ${DOCKER_IMAGE}"

          # Validate that DOCKER_IMAGE is not empty
          if [ -z "$DOCKER_IMAGE" ]; then
            echo "❌ Error: DOCKER_IMAGE is empty!"
            echo "build-image outputs may not have been set correctly"
            exit 1
          fi

          terraform plan \
            -var="project_id=${{ env.PROJECT_ID }}" \
            -var="region=${{ env.REGION }}" \
            -var="environment=${{ env.ENVIRONMENT }}" \
            -var="docker_image=${DOCKER_IMAGE}" \
            -out=tfplan

      - name: Apply Infrastructure
        working-directory: ./terraform/infrastructure
        run: terraform apply -auto-approve tfplan

      - name: Get Terraform Outputs
        id: terraform_output
        working-directory: ./terraform/infrastructure
        run: |
          echo "service_name=$(terraform output -raw service_name)" >> $GITHUB_OUTPUT
          echo "cloud_run_url=$(terraform output -raw cloud_run_url)" >> $GITHUB_OUTPUT

  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest
    needs: [build-image, infrastructure]

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          IMAGE_TAG="${{ needs.build-image.outputs.image_sha }}"

          gcloud run deploy ${{ needs.infrastructure.outputs.cloud_run_service }} \
            --image ${IMAGE_TAG} \
            --region ${{ env.REGION }} \
            --platform managed \
            --quiet

      - name: Run Database Migrations
        run: |
          # Get Cloud SQL connection name
          CLOUD_SQL_CONNECTION=$(gcloud sql instances describe portfolio-db-${{ env.ENVIRONMENT }} \
            --project=${{ env.PROJECT_ID }} \
            --format="value(connectionName)")

          # Run migrations via Cloud Run Jobs or a one-off container
          gcloud run jobs create migrate-${{ github.run_number }} \
            --image ${{ needs.build-image.outputs.image_sha }} \
            --region ${{ env.REGION }} \
            --set-cloudsql-instances=${CLOUD_SQL_CONNECTION} \
            --command python \
            --args "manage.py,migrate" \
            --max-retries 1 \
            --parallelism 1 \
            --task-timeout 5m \
            --service-account ${{ secrets.WIF_SERVICE_ACCOUNT }} \
            || true

          # Execute the migration job
          gcloud run jobs execute migrate-${{ github.run_number }} \
            --region ${{ env.REGION }} \
            --wait

      - name: Deployment Summary
        run: |
          echo "## Deployment Complete! 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Application Details" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** ${{ env.ENVIRONMENT }}" >> $GITHUB_STEP_SUMMARY
          echo "- **URL:** ${{ needs.infrastructure.outputs.cloud_run_url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Service:** ${{ needs.infrastructure.outputs.cloud_run_service }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Region:** ${{ env.REGION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Image:** ${{ needs.build-image.outputs.image_sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Commit" >> $GITHUB_STEP_SUMMARY
          echo "- **SHA:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Author:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Message:** ${{ github.event.head_commit.message }}" >> $GITHUB_STEP_SUMMARY

  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: [infrastructure, deploy]

    steps:
      - name: Test Application Health
        run: |
          URL="${{ needs.infrastructure.outputs.cloud_run_url }}"
          echo "Testing application at ${URL}"

          # Test homepage
          response=$(curl -s -o /dev/null -w "%{http_code}" ${URL})
          if [ $response -eq 200 ]; then
            echo "✅ Homepage is accessible (HTTP ${response})"
          else
            echo "❌ Homepage returned HTTP ${response}"
            exit 1
          fi

          # Test admin page
          admin_response=$(curl -s -o /dev/null -w "%{http_code}" ${URL}/admin/)
          if [ $admin_response -eq 200 ] || [ $admin_response -eq 302 ]; then
            echo "✅ Admin page is accessible (HTTP ${admin_response})"
          else
            echo "❌ Admin page returned HTTP ${admin_response}"
            exit 1
          fi

          echo "All smoke tests passed! ✅"
