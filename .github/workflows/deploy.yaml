name: Deploy to Cloud Run

on:
  push:
    branches:
      - main
      - production
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: ${{ secrets.GCP_REGION || 'us-central1' }}
  ENVIRONMENT: ${{ github.event.inputs.environment || 'production' }}

jobs:
  check-prerequisites:
    name: Validate Prerequisites
    runs-on: ubuntu-latest

    steps:
      - name: Check Required Secrets
        id: check
        run: |
          echo "## Checking Prerequisites" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          MISSING_SECRETS=()

          if [ -z "${{ secrets.WIF_PROVIDER }}" ]; then
            MISSING_SECRETS+=("WIF_PROVIDER")
          fi

          if [ -z "${{ secrets.WIF_SERVICE_ACCOUNT }}" ]; then
            MISSING_SECRETS+=("WIF_SERVICE_ACCOUNT")
          fi

          if [ -z "${{ secrets.TF_STATE_BUCKET }}" ]; then
            MISSING_SECRETS+=("TF_STATE_BUCKET")
          fi

          if [ -z "${{ secrets.GCP_PROJECT_ID }}" ]; then
            MISSING_SECRETS+=("GCP_PROJECT_ID")
          fi

          if [ ${#MISSING_SECRETS[@]} -gt 0 ]; then
            echo "### ❌ Missing Required Secrets" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "The following secrets must be configured before deployment:" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            for secret in "${MISSING_SECRETS[@]}"; do
              echo "- \`$secret\`" >> $GITHUB_STEP_SUMMARY
            done
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Setup Instructions" >> $GITHUB_STEP_SUMMARY
            echo "1. Run the bootstrap workflow first" >> $GITHUB_STEP_SUMMARY
            echo "2. Configure the secrets from bootstrap outputs" >> $GITHUB_STEP_SUMMARY
            echo "3. Run the initial-setup workflow to create the bootstrap image" >> $GITHUB_STEP_SUMMARY
            echo "4. Then run this deployment workflow" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          echo "### ✅ All Required Secrets Present" >> $GITHUB_STEP_SUMMARY
          echo "Proceeding with deployment..." >> $GITHUB_STEP_SUMMARY

  build-image:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: check-prerequisites
    outputs:
      image_tag: ${{ steps.image.outputs.tag }}
      image_digest: ${{ steps.image.outputs.digest }}

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build Docker Image
        id: image
        run: |
          set -e  # Exit on error

          # Debug environment variables
          echo "Debug: REGION = ${{ env.REGION }}"
          echo "Debug: PROJECT_ID = ${{ env.PROJECT_ID }}"
          echo "Debug: github.sha = ${{ github.sha }}"

          # Check if required env vars are set
          if [ -z "${{ env.REGION }}" ] || [ -z "${{ env.PROJECT_ID }}" ]; then
            echo "❌ Error: REGION or PROJECT_ID is not set!"
            echo "REGION: '${{ env.REGION }}'"
            echo "PROJECT_ID: '${{ env.PROJECT_ID }}'"
            exit 1
          fi

          IMAGE_BASE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/portfolio-images/portfolio"
          IMAGE_TAG="${IMAGE_BASE}:${{ github.sha }}"

          echo "### 🔨 Building Docker Image" >> $GITHUB_STEP_SUMMARY
          echo "Building Docker image: ${IMAGE_TAG}"
          echo "Image base: ${IMAGE_BASE}"
          echo "Full tag: ${IMAGE_TAG}"

          # Verify Artifact Registry exists
          if ! gcloud artifacts repositories describe portfolio-images \
            --location=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} 2>/dev/null; then
            echo "❌ Artifact Registry 'portfolio-images' not found!"
            echo "Please run the bootstrap workflow first to create the registry."
            exit 1
          fi

          # Build with Dockerfile in docker/ directory, context is root
          if ! docker build \
            -f docker/Dockerfile \
            -t ${IMAGE_TAG} \
            -t ${IMAGE_BASE}:latest \
            . ; then
            echo "❌ Docker build failed!"
            exit 1
          fi

          echo "✅ Docker image built successfully"

          # Push the images with retry logic
          MAX_RETRIES=3
          RETRY_COUNT=0

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            echo "Pushing Docker image (attempt $((RETRY_COUNT + 1))/${MAX_RETRIES})..."

            if docker push ${IMAGE_TAG} && docker push ${IMAGE_BASE}:latest; then
              echo "✅ Docker images pushed successfully"
              break
            else
              RETRY_COUNT=$((RETRY_COUNT + 1))
              if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
                echo "❌ Failed to push Docker image after ${MAX_RETRIES} attempts"
                exit 1
              fi
              echo "⚠️ Push failed, retrying in 5 seconds..."
              sleep 5
            fi
          done

          # Verify the push succeeded
          if ! gcloud artifacts docker images describe ${IMAGE_TAG} 2>/dev/null; then
            echo "❌ Image verification failed - image not found in registry after push!"
            exit 1
          fi

          # Get the image digest for extra verification
          DIGEST=$(docker inspect ${IMAGE_TAG} --format='{{index .RepoDigests 0}}' | cut -d '@' -f2 || echo "unknown")

          # Output for other jobs - critical for workflow
          echo "tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "digest=${DIGEST}" >> $GITHUB_OUTPUT

          # Debug output
          echo "::notice title=Image Tag Output::tag=${IMAGE_TAG}"
          echo "::notice title=Image Digest::digest=${DIGEST}"

          # Summary
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ Docker Image Built and Pushed" >> $GITHUB_STEP_SUMMARY
          echo "- **Image:** \`${IMAGE_TAG}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Digest:** \`${DIGEST}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Also tagged as:** \`latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Registry:** \`${IMAGE_BASE}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Job Outputs Set:**" >> $GITHUB_STEP_SUMMARY
          echo "- \`image_tag\`: ${IMAGE_TAG}" >> $GITHUB_STEP_SUMMARY
          echo "- \`image_digest\`: ${DIGEST}" >> $GITHUB_STEP_SUMMARY

  infrastructure:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    needs: build-image
    outputs:
      cloud_run_service: ${{ steps.terraform_output.outputs.service_name }}
      cloud_run_url: ${{ steps.terraform_output.outputs.cloud_run_url }}
      docker_image_tag: ${{ steps.docker_image.outputs.docker_image_tag }}

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0
          terraform_wrapper: false

      - name: Initialize Terraform
        working-directory: ./terraform/infrastructure
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"

      - name: Validate and Set Docker Image
        id: docker_image
        run: |
          # CRITICAL: Initialize DOCKER_IMAGE at top level to avoid scoping issues
          DOCKER_IMAGE=""

          # Debug: Show what we received from build-image job
          echo "::notice title=Received from build-image::image_tag=${{ needs.build-image.outputs.image_tag }}"
          echo "::notice title=Received from build-image::image_digest=${{ needs.build-image.outputs.image_digest }}"

          # Get the image from build-image job
          IMAGE_FROM_BUILD="${{ needs.build-image.outputs.image_tag }}"
          IMAGE_REGISTRY="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/portfolio-images/portfolio"

          echo "Image from build job: ${IMAGE_FROM_BUILD}"
          echo "Registry base: ${IMAGE_REGISTRY}"

          # If no image from build job, try to use latest as fallback
          if [ -z "${IMAGE_FROM_BUILD}" ]; then
            echo "⚠️ No image tag from build job, checking for existing images..."

            # Check if any image exists in the registry
            if gcloud artifacts docker images list ${IMAGE_REGISTRY} --limit=1 2>/dev/null | grep -q portfolio; then
              DOCKER_IMAGE="${IMAGE_REGISTRY}:latest"
              echo "✅ Using existing image: ${DOCKER_IMAGE}"
            else
              echo "❌ No Docker image available. Please run initial-setup workflow first."
              echo "### ❌ Deployment Failed" >> $GITHUB_STEP_SUMMARY
              echo "No Docker image found. Please ensure:" >> $GITHUB_STEP_SUMMARY
              echo "1. The initial-setup workflow has been run successfully" >> $GITHUB_STEP_SUMMARY
              echo "2. The build-image job completed successfully" >> $GITHUB_STEP_SUMMARY
              exit 1
            fi
          else
            DOCKER_IMAGE="${IMAGE_FROM_BUILD}"
            echo "✅ Using newly built image: ${DOCKER_IMAGE}"
          fi

          # Verify the image actually exists
          IMAGE_NAME=$(echo ${DOCKER_IMAGE} | cut -d':' -f1)
          IMAGE_TAG_PART=$(echo ${DOCKER_IMAGE} | cut -d':' -f2)

          if gcloud artifacts docker images describe ${IMAGE_NAME}:${IMAGE_TAG_PART} 2>/dev/null; then
            echo "✅ Image verified in Artifact Registry"
          else
            echo "⚠️ Image not found in registry, trying :latest tag..."
            DOCKER_IMAGE="${IMAGE_NAME}:latest"
            if gcloud artifacts docker images describe ${DOCKER_IMAGE} 2>/dev/null; then
              echo "✅ Using :latest tag as fallback"
            else
              echo "❌ No valid Docker image found in Artifact Registry"
              exit 1
            fi
          fi

          # CRITICAL: Verify DOCKER_IMAGE is not empty before setting output
          if [ -z "${DOCKER_IMAGE}" ]; then
            echo "❌ FATAL ERROR: DOCKER_IMAGE variable is empty after all checks!"
            echo "This should never happen. Debug info:"
            echo "  IMAGE_FROM_BUILD: '${IMAGE_FROM_BUILD}'"
            echo "  IMAGE_REGISTRY: '${IMAGE_REGISTRY}'"
            echo "  IMAGE_NAME: '${IMAGE_NAME}'"
            exit 1
          fi

          # CRITICAL FIX: Extract just the tag part (avoids secret masking issues)
          # Docker image format: region-docker.pkg.dev/project/repo/image:tag
          # We only need the tag part (e.g., "latest" or "sha-123456")
          IMAGE_TAG_ONLY=$(echo "${DOCKER_IMAGE}" | rev | cut -d':' -f1 | rev)

          echo "Full Docker image: ${DOCKER_IMAGE}"
          echo "Extracted tag only: ${IMAGE_TAG_ONLY}"

          # Pass only the tag, not the full URL (avoids secret masking)
          echo "docker_image_tag=${IMAGE_TAG_ONLY}" >> $GITHUB_OUTPUT

          # Also pass the full image (might be masked but try anyway)
          echo "docker_image=${DOCKER_IMAGE}" >> $GITHUB_OUTPUT

          echo "### Docker Image for Deployment" >> $GITHUB_STEP_SUMMARY
          echo "- **Full Image:** \`${DOCKER_IMAGE}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag Only:** \`${IMAGE_TAG_ONLY}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Note: Only passing tag '${IMAGE_TAG_ONLY}' to avoid secret masking issues" >> $GITHUB_STEP_SUMMARY

      - name: Plan Infrastructure
        working-directory: ./terraform/infrastructure
        run: |
          # Use the validated Docker image
          DOCKER_IMAGE="${{ steps.docker_image.outputs.docker_image }}"

          echo "Deploying with Docker image: ${DOCKER_IMAGE}"

          terraform plan \
            -var="project_id=${{ env.PROJECT_ID }}" \
            -var="region=${{ env.REGION }}" \
            -var="environment=${{ env.ENVIRONMENT }}" \
            -var="docker_image=${DOCKER_IMAGE}" \
            -out=tfplan

      - name: Apply Infrastructure
        working-directory: ./terraform/infrastructure
        run: terraform apply -auto-approve tfplan

      - name: Get Terraform Outputs
        id: terraform_output
        working-directory: ./terraform/infrastructure
        run: |
          echo "service_name=$(terraform output -raw service_name)" >> $GITHUB_OUTPUT
          echo "cloud_run_url=$(terraform output -raw cloud_run_url)" >> $GITHUB_OUTPUT

      - name: Verify Infrastructure Outputs
        run: |
          echo "### Infrastructure Job Outputs" >> $GITHUB_STEP_SUMMARY
          echo "- **Service Name:** ${{ steps.terraform_output.outputs.service_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Cloud Run URL:** ${{ steps.terraform_output.outputs.cloud_run_url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Docker Image Tag:** ${{ steps.docker_image.outputs.docker_image_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The image tag will be used to reconstruct the full URL in deploy-application job." >> $GITHUB_STEP_SUMMARY
          echo "This avoids GitHub Actions masking issues with secrets in outputs." >> $GITHUB_STEP_SUMMARY

          # Final verification
          if [ -z "${{ steps.docker_image.outputs.docker_image_tag }}" ]; then
            echo "⚠️ WARNING: docker_image_tag output is empty!" >> $GITHUB_STEP_SUMMARY
            echo "The deploy-application job will fail." >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ Image tag '${{ steps.docker_image.outputs.docker_image_tag }}' will be passed to deploy-application" >> $GITHUB_STEP_SUMMARY
          fi

  deploy-application:
    name: Deploy Application
    runs-on: ubuntu-latest
    needs: [build-image, infrastructure]

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          # Get the image tag from infrastructure job
          IMAGE_TAG_ONLY="${{ needs.infrastructure.outputs.docker_image_tag }}"

          echo "### Reconstructing Docker Image URL"
          echo "Received tag from infrastructure: '${IMAGE_TAG_ONLY}'"
          echo "PROJECT_ID: ${{ env.PROJECT_ID }}"
          echo "REGION: ${{ env.REGION }}"

          # Validate we have the required components
          if [ -z "${IMAGE_TAG_ONLY}" ]; then
            echo "❌ Error: No image tag received from infrastructure job!"
            exit 1
          fi

          if [ -z "${{ env.PROJECT_ID }}" ] || [ -z "${{ env.REGION }}" ]; then
            echo "❌ Error: PROJECT_ID or REGION is not set!"
            exit 1
          fi

          # Reconstruct the full image URL
          FULL_IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/portfolio-images/portfolio:${IMAGE_TAG_ONLY}"

          echo "✅ Reconstructed full image URL: ${FULL_IMAGE}"
          echo "Service: ${{ needs.infrastructure.outputs.cloud_run_service }}"
          echo "Region: ${{ env.REGION }}"

          gcloud run deploy ${{ needs.infrastructure.outputs.cloud_run_service }} \
            --image ${FULL_IMAGE} \
            --region ${{ env.REGION }} \
            --platform managed \
            --quiet

          echo "✅ Cloud Run service updated successfully with image: ${FULL_IMAGE}"

      # Note: Database migrations now run automatically during Docker image build
      # SQLite database is initialized inside the container

      - name: Deployment Summary
        run: |
          echo "## Deployment Complete! 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Application Details" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** ${{ env.ENVIRONMENT }}" >> $GITHUB_STEP_SUMMARY
          echo "- **URL:** ${{ needs.infrastructure.outputs.cloud_run_url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Service:** ${{ needs.infrastructure.outputs.cloud_run_service }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Region:** ${{ env.REGION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Image:** ${{ needs.build-image.outputs.image_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Commit" >> $GITHUB_STEP_SUMMARY
          echo "- **SHA:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Author:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Message:** ${{ github.event.head_commit.message }}" >> $GITHUB_STEP_SUMMARY

  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: [infrastructure, deploy-application]

    steps:
      - name: Test Application Health
        run: |
          URL="${{ needs.infrastructure.outputs.cloud_run_url }}"
          echo "Testing application at ${URL}"
          echo ""

          # Test homepage - use -L to follow redirects, -f to fail on HTTP errors
          echo "Testing homepage..."
          if curl -L -f -s -o /dev/null -w "HTTP Status: %{http_code}\n" ${URL}; then
            echo "✅ Homepage is accessible"
          else
            echo "❌ Homepage test failed"
            # Show more details for debugging
            curl -L -I ${URL}
            exit 1
          fi

          echo ""
          echo "Testing admin page..."
          # Test admin page - it's normal for admin to redirect to login (302)
          admin_response=$(curl -L -s -o /dev/null -w "%{http_code}" ${URL}/admin/)
          if [ $admin_response -eq 200 ] || [ $admin_response -eq 302 ] || [ $admin_response -eq 301 ]; then
            echo "✅ Admin page is accessible (HTTP ${admin_response})"
          else
            echo "❌ Admin page returned unexpected status: HTTP ${admin_response}"
            # Show more details for debugging
            curl -L -I ${URL}/admin/
            exit 1
          fi

          echo ""
          echo "All smoke tests passed! ✅"